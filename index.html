<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
  <title>Jar of Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&family=Young+Serif&display=swap">
</head>

<body>
  <style>
    /* Layout: a lamp-lit night shelf. The jar and a pile of read chits sit on it. A chit flies out of the jar into a reader layer, the jar blurs behind it, and the chit unfolds like a tri-fold letter. */
    :root {
      --bg: #14101E;
      --bg2: #231A2E;
      --lampglow: rgba(243, 181, 98, .26);
      --lamp: #F3B562;
      --fg: #F2EAF3;
      --muted: #B3A8C0;
      --line: #3A2F48;
      --dim: rgba(10, 7, 16, .55);
      --wood: #4B3325;
      --wood-hi: #6E4D39;
      --wood-lo: #37251B;
      --glassfill: rgba(207, 224, 234, .07);
      --glassline: rgba(214, 232, 244, .5);
      --brass-hi: #E6C58B;
      --brass: #C49A5C;
      --brass-lo: #8E6A38;
      --paper: #F5ECDA;
      --paper-2: #E8D6B4;
      --paper-rose: #F6DDD8;
      --paper-sage: #DCE4D0;
      --paper-sky: #D6E3EC;
      --paper-blush: #F1CFCB;
      --ink: #2E2420;
      --rule: rgba(46, 36, 32, .14);
      --rose: #C4526A;
      --accent: #F0A0AE;
      --accent-ink: #2B0E17;
      --coat: #B7AEC2;
      --coat-ink: #4A4056;
      --warn: #F3B562;
      --display: "Young Serif", Georgia, "Times New Roman", serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(80% 50% at 50% 56%, var(--lampglow), transparent 72%), radial-gradient(120% 80% at 50% 120%, var(--bg2), transparent 60%);
      color: var(--fg);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.5;
      padding-inline: 20px;
      overflow-x: hidden
    }

    button,
    a,
    .note {
      -webkit-tap-highlight-color: transparent
    }

    button {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible,
    .note:focus-visible {
      outline: 3px solid var(--fg);
      outline-offset: 4px
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-block: 12px 16px;
      position: relative
    }

    .top {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 20
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      background: var(--dim)
    }

    .bokeh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .bokeh i {
      position: absolute;
      border-radius: 50%;
      background: var(--lamp);
      opacity: .09;
      filter: blur(18px);
      animation: drift 14s ease-in-out infinite alternate
    }

    .bokeh i:nth-child(1) {
      width: 90px;
      height: 90px;
      left: 6%;
      top: 14%
    }

    .bokeh i:nth-child(2) {
      width: 60px;
      height: 60px;
      right: 8%;
      top: 26%;
      animation-delay: -4s
    }

    .bokeh i:nth-child(3) {
      width: 120px;
      height: 120px;
      left: 60%;
      bottom: 12%;
      animation-delay: -8s
    }

    .bokeh i:nth-child(4) {
      width: 50px;
      height: 50px;
      left: 14%;
      bottom: 24%;
      animation-delay: -2s
    }

    .motes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .motes i {
      position: absolute;
      bottom: -12px;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: var(--lamp);
      opacity: 0;
      animation: mote var(--d) linear var(--dl) infinite
    }

    @keyframes mote {
      0% {
        transform: translate(0, 0);
        opacity: 0
      }

      15% {
        opacity: .55
      }

      85% {
        opacity: .25
      }

      100% {
        transform: translate(var(--x), -85vh);
        opacity: 0
      }
    }

    @keyframes drift {
      from {
        transform: translate(0, 0)
      }

      to {
        transform: translate(14px, -20px)
      }
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1
    }

    #scene {
      margin-block: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      text-align: center
    }

    #head {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      transition: opacity .6s ease
    }

    .reading #head,
    .reading #hint {
      opacity: 0
    }

    .title {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(26px, 7.4vw, 32px);
      line-height: 1.15;
      margin: 0;
      text-wrap: balance
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      max-width: 30ch;
      text-wrap: balance
    }

    .hint {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      transition: opacity .6s ease
    }

    /* shelf */
    .shelf {
      position: relative;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-top: 6px
    }

    .board {
      width: calc(100% + 24px);
      height: 16px;
      border-radius: 3px;
      margin-top: -3px;
      background: repeating-linear-gradient(90deg, transparent 0 38px, rgba(0, 0, 0, .12) 38px 39px), linear-gradient(var(--wood-hi) 0 3px, var(--wood) 3px, var(--wood-lo));
      box-shadow: 0 16px 30px rgba(0, 0, 0, .45)
    }

    /* the jar */
    #jarWrap {
      flex: none;
      transform-origin: 50% 62%;
      transition: filter .9s ease, transform 1s ease
    }

    .reading #jarWrap {
      filter: blur(5px) brightness(.7);
      transform: translateY(24vh) scale(1.55);
      transition: filter .9s ease, transform 1.5s cubic-bezier(.3, .6, .3, 1) .5s
    }

    .board,
    .pile {
      transition: filter .9s ease
    }

    .reading .board,
    .reading .pile {
      filter: blur(4px) brightness(.45)
    }

    .jarbtn {
      position: relative;
      display: block;
      width: min(56vw, 226px);
      aspect-ratio: 200/290
    }

    .jarbtn:disabled {
      cursor: default
    }

    .jl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none
    }

    .chits {
      position: absolute;
      left: 16%;
      top: 34.5%;
      width: 68%;
      height: 58.6%;
      clip-path: url(#jarclip);
      -webkit-clip-path: url(#jarclip)
    }

    .glassb {
      fill: url(#gfill);
      stroke: var(--glassline);
      stroke-width: 1.6
    }

    .sheen {
      fill: url(#gsheen)
    }

    .shine {
      fill: none;
      stroke: #fff;
      stroke-linecap: round
    }

    .rimc {
      fill: var(--glassfill);
      stroke: var(--glassline);
      stroke-width: 1.6
    }

    #lidg {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transition: transform .9s cubic-bezier(.4, 0, .2, 1), opacity .8s ease
    }

    .open #lidg {
      transform: translate(0, -40px) rotate(-6deg);
      opacity: 0
    }

    .lidr {
      fill: url(#brass);
      stroke: var(--brass-lo);
      stroke-width: 1
    }

    .lidline {
      stroke: var(--brass-lo);
      stroke-width: 1;
      opacity: .55
    }

    .candle {
      opacity: 0;
      transition: opacity .8s ease
    }

    .phase-candle .candle {
      opacity: 1
    }

    .wax {
      fill: var(--paper)
    }

    .wickl {
      stroke: var(--fg);
      stroke-width: 2;
      stroke-linecap: round
    }

    .flame,
    .halo {
      transition: opacity .7s ease;
      transform-box: fill-box;
      transform-origin: center bottom
    }

    .flame {
      fill: var(--lamp);
      animation: flick 1.6s ease-in-out infinite
    }

    .halo {
      animation: glowp 2.4s ease-in-out infinite
    }

    .out .flame,
    .out .halo {
      opacity: 0;
      animation: none
    }

    .smoke {
      fill: none;
      stroke: var(--muted);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0
    }

    .out .smoke {
      animation: rise 2.6s ease-out forwards
    }

    @keyframes flick {

      0%,
      100% {
        transform: scale(1, 1) rotate(0)
      }

      30% {
        transform: scale(.94, 1.05) rotate(-2deg)
      }

      60% {
        transform: scale(1.04, .97) rotate(2deg)
      }
    }

    @keyframes glowp {

      0%,
      100% {
        opacity: .55
      }

      50% {
        opacity: .9
      }
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translateY(6px)
      }

      25% {
        opacity: .7
      }

      100% {
        opacity: 0;
        transform: translateY(-34px)
      }
    }

    /* small folded chits, in the jar and in the pile */
    .chit {
      position: absolute;
      width: 32%;
      aspect-ratio: 1/.58;
      border-radius: 2px;
      background: var(--paper);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .45)
    }

    .chit::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: linear-gradient(180deg, rgba(0, 0, 0, .08), transparent 18%, transparent 82%, rgba(0, 0, 0, .1))
    }

    .chit.c2 {
      background: var(--paper-2)
    }

    .chit.c3 {
      background: var(--paper-blush)
    }

    .chit.c4 {
      background: var(--paper-sage)
    }

    .chit.c5 {
      background: var(--paper-sky)
    }

    .chit.real::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 11%;
      margin-left: -5.5%;
      background: var(--rose)
    }

    .chit.real.fin {
      background: var(--paper-rose)
    }

    .pile {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 76px;
      height: 130px
    }

    .pile .chit {
      width: 64px;
      left: 6px;
      cursor: pointer;
      animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both
    }

    .pile .chit:hover {
      filter: brightness(1.08)
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.4)
      }
    }

    /* reader layer */
    #reader {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 20px;
      background: radial-gradient(80% 60% at 50% 45%, transparent, var(--dim))
    }

    .rwrap {
      margin-block: auto;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px
    }

    .card-area {
      position: relative;
      width: var(--W);
      height: calc(var(--H)*2);
      flex: none;
    }

    #slot {
      position: absolute;
      inset: 0;
    }

    .note {
      position: absolute;
      left: 0;
      top: var(--H);
      width: var(--W);
      height: var(--H);
      font-size: calc(var(--W)*.082);
      cursor: pointer;
      color: var(--ink)
    }

    .note.unfolded {
      cursor: default
    }

    .sheet {
      position: absolute;
      inset: 0;
      perspective: 1300px
    }

    .band {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-color: var(--paper);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .4);
      border-radius: 0 0 4px 4px;
    }

    .flap {
      position: absolute;
      left: 0;
      right: 0;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 1.05s cubic-bezier(.45, .05, .25, 1)
    }

    .flap.top {
      bottom: calc(100% - 1px);
      transform-origin: 50% 100%;
      transform: rotateX(-180deg);
      z-index: 4;
      border-radius: 4px 4px 0 0;
    }

    .unfolded .flap.top {
      transform: rotateX(0)
    }

    .face {
      position: absolute;
      inset: 0;
      background-color: var(--paper);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .28)
    }

    .face.back {
      transform: rotateX(180deg);
      background-color: var(--paper-2)
    }

    .band::after,
    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, .09), transparent 14%, transparent 86%, rgba(0, 0, 0, .09))
    }

    .band,
    .face {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .15 0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")
    }

    .final .band,
    .final .face {
      background-color: var(--paper-rose)
    }

    .final .face.back {
      background-color: var(--paper-blush)
    }

    .pad {
      position: absolute;
      inset: 0;
      padding: calc(var(--W)*.06) calc(var(--W)*.07) calc(var(--W)*.12) calc(var(--W)*.07);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(160, 120, 100, 0.08) 27px, rgba(160, 120, 100, 0.08) 28px);
    }

    .hand {
      font-family: var(--hand);
      font-weight: 500;
      line-height: 1.25;
      margin: 0;
      font-size: 1.05em;
      color: var(--ink);
    }

    .hand.lg {
      font-size: 1.26em;
      font-weight: 700;
      color: var(--rose);
    }

    .story-2 {
      padding-right: calc(var(--W)*.22);
    }

    /* Staggered story text animations */
    .unfolded .story-1 {
      animation: storyReveal 0.65s cubic-bezier(0.2, 0.8, 0.3, 1) forwards 0.35s;
      opacity: 0;
      transform: translateY(8px);
    }

    .unfolded .story-2 {
      animation: storyReveal 0.75s cubic-bezier(0.2, 0.8, 0.3, 1) forwards 0.95s;
      opacity: 0;
      transform: translateY(8px);
    }

    .unfolded .stamp {
      animation: stampPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 1.35s;
      opacity: 0;
      transform: scale(0.7) rotate(-4deg);
    }

    @keyframes storyReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes stampPop {
      to {
        opacity: 0.95;
        transform: scale(1) rotate(-4deg);
      }
    }

    .final .note {
      font-size: calc(var(--W)*.078)
    }

    .final .hand.lg {
      font-size: 1.12em
    }

    .outer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24% 0 8%
    }

    .outer .hand {
      font-size: 1.5em;
      font-weight: 700;
      color: var(--rose);
      text-wrap: balance
    }

    .stamp {
      position: absolute;
      right: calc(var(--W)*.05);
      bottom: calc(var(--W)*.025);
      font-family: var(--body);
      font-size: calc(var(--W)*.03);
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--rose);
      border: 1px dashed rgba(196, 82, 106, 0.5);
      border-radius: 999px;
      padding: 2px 9px;
      background: rgba(246, 221, 216, 0.45);
    }

    /* Instax Mini Scrapbook Card - True Portrait Proportions in 2-Panel Card */
    .polaroid {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-1.5deg);
      height: 92%;
      aspect-ratio: 0.82 / 1;
      max-width: 90%;
      background: #FFFFFF;
      padding: 6px 6px 6px 6px;
      border-radius: 4px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .28), 0 2px 6px rgba(0, 0, 0, .14);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      transition: transform 0.4s ease;
    }

    .polaroid.landscape {
      height: 88%;
      aspect-ratio: 1.35 / 1;
      max-width: 92%;
    }

    /* Final Birthday Card - Golden aura & celebratory styling */
    .note.final .band {
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.32), 0 16px 36px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .note.final .polaroid {
      height: 95%;
      aspect-ratio: 0.88 / 1;
      max-width: 94%;
      padding: 7px 7px 8px 7px;
      box-shadow: 0 0 32px rgba(255, 215, 0, 0.42), 0 16px 36px rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 215, 0, 0.35);
    }

    /* Floating Crown on Birthday Photo */
    .photo-crown {
      position: absolute;
      top: 5px;
      left: 45%;
      transform: translateX(-50%) rotate(-6deg);
      font-size: 38px;
      line-height: 1;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 14px rgba(255, 215, 0, 0.85));
      z-index: 10;
      pointer-events: none;
      animation: crownFloat 2.2s ease-in-out infinite alternate;
    }

    @keyframes crownFloat {
      0% {
        transform: translateX(-50%) rotate(-6deg) translateY(0);
      }

      100% {
        transform: translateX(-50%) rotate(-2deg) translateY(-4px);
      }
    }

    /* Floating Animated Stickers outside the Final Card */
    .final-stickers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.8s ease 0.4s;
    }

    .final-stickers.show {
      opacity: 1;
    }

    .f-sticker {
      position: absolute;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
      will-change: transform;
    }

    .f-sticker-flower {
      top: -50px;
      right: -95px;
      width: 125px;
      height: 125px;
      animation: stickerFloat 3s ease-in-out infinite alternate;
    }

    .f-sticker-spin {
      bottom: -15px;
      right: -105px;
      width: 110px;
      height: 110px;
      border-radius: 14px;
      animation: stickerBounce 2.4s ease-in-out infinite alternate;
    }

    .f-sticker-couple {
      top: 48%;
      left: -115px;
      transform: translateY(-50%) rotate(-4deg);
      width: 110px;
      height: 110px;
      border-radius: 12px;
      animation: stickerFloatLeft 3.2s ease-in-out infinite alternate;
    }

    @media (max-width: 650px) {
      .f-sticker-flower {
        top: -35px;
        right: -25px;
        width: 80px;
        height: 80px;
      }

      .f-sticker-spin {
        bottom: -10px;
        right: -20px;
        width: 75px;
        height: 75px;
        border-radius: 8px;
      }

      .f-sticker-couple {
        top: 20%;
        left: -24px;
        transform: translateY(-50%) rotate(-4deg);
        width: 75px;
        height: 75px;
        border-radius: 8px;
      }
    }

    @keyframes stickerFloat {
      0% {
        transform: translateY(0) rotate(3deg);
      }

      100% {
        transform: translateY(-8px) rotate(-3deg);
      }
    }

    @keyframes stickerBounce {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(-6px) scale(1.05);
      }
    }

    @keyframes stickerFloatLeft {
      0% {
        transform: translateY(0) rotate(-4deg);
      }

      100% {

          if (n < NOTES.length - 1) { present(n + 1) }
          else {
            reader.hidden = true; app.classList.remove('reading');
            setPhase('candle'); busy = false;
          }
        });
      }
      function closeReader(note, final) {
        if (final) {
          toPile(note, function () {
            if (taken.indexOf(total - 1) < 0) taken.push(total - 1);
            renderPile();
            reader.hidden = true; app.classList.remove('reading');
            setPhase('done'); busy = false;
          });
        } else {
          $('#readNav').classList.remove('show'); $('#wishHost').classList.remove('show');
          var a = note.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
          var d = function () { reader.hidden = true; app.classList.remove('reading'); busy = false };
          if (a.finished) { a.finished.then(d, d) } else { setTimeout(d, 420) }
        }
      }

      /* ---- jar tap ---- */
      jarBtn.addEventListener('click', function () {
        if (busy) return;
        if (phase === 'intro') {
          busy = true; startMusic();
          app.classList.add('open');
          setTimeout(function () { present(0) }, 900);
        } else if (phase === 'candle') {
          busy = true;
          app.classList.add('out');
          setTimeout(function () {
            app.classList.add('open');
            setTimeout(function () { present(total - 1) }, 900);
          }, 1400);
        }
      });

      setPhase('intro');
    })();
  </script>

</body>

</html>
